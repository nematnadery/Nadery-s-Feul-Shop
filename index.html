<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تیل‌فروشی برادران نادری</title>

  <!-- فونت‌ها: لالزار برای اسم دوکان، وزیرمتن برای بقیه -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<!-- کلاس locked یعنی «قفل است». جی‌اس بعد از ورود موفق آن را برمی‌دارد. -->
<body class="">

  <!-- ============================================================
       صفحه ورود
       ============================================================ -->
  <div class="login" id="login-screen">

    <!-- سمت راست: هویت دوکان و شیشه سطح‌نمای مخزن -->
    <section class="brand">
      <div class="brand__id">
        <img class="brand__logo" src="pic/logo.png" alt="" width="64" height="64">
        <div class="brand__text">
          <h1 class="brand__name">تیل‌فروشی<br>برادران نادری</h1>
          <p class="brand__tag">حساب، خرید، فروش و موجودی سوخت</p>
        </div>
      </div>

      <!-- شیشه سطح‌نمای مخزن (فقط تزئینی) -->
      <div class="tank" aria-hidden="true">
        <div class="tank__glass">
          <div class="tank__fuel"></div>
        </div>
        <div class="tank__ruler"></div>
        <ul class="tank__marks">
          <li>۱۰۰</li>
          <li>۷۵</li>
          <li>۵۰</li>
          <li>۲۵</li>
          <li>۰</li>
        </ul>
      </div>
    </section>

    <!-- سمت چپ: فرم -->
    <section class="panel">
      <form class="form" id="login-form" autocomplete="off">
        <h2 class="form__title" id="login-title">ورود به برنامه</h2>
        <p class="form__hint" id="login-hint">رمز عبور را وارد کنید.</p>

        <label class="field">
          <span class="field__label">رمز عبور</span>
          <input class="field__input" type="password" id="login-password" required>
        </label>

        <label class="field" id="login-password2-wrap" hidden>
          <span class="field__label">تکرار رمز عبور</span>
          <input class="field__input" type="password" id="login-password2">
        </label>

        <div class="form-error" id="login-error" role="alert" hidden></div>

        <button class="btn" type="submit" id="login-submit">ورود</button>

        <p class="form__note">اطلاعات این برنامه فقط روی همین دستگاه ذخیره می‌شود.</p>
      </form>
    </section>
  </div>

  <!-- ============================================================
       برنامه (بعد از ورود دیده می‌شود)
       فعلاً فقط یک صفحه خالی است. بخش‌ها را بعداً اینجا اضافه می‌کنیم.
       ============================================================ -->
  <div class="app">
    <header class="app__bar">
      <img class="app__logo" src="pic/logo.png" alt="" width="40" height="40">
      <span class="app__name">تیل‌فروشی برادران نادری</span>
      <button class="btn btn--ghost" type="button" id="btn-logout">خروج</button>
    </header>

    <main class="app__main">
      <h1 class="app__title">صفحه اصلی</h1>
      <p class="app__empty">هنوز بخشی اضافه نشده. خرید، فروش و موجودی را قدم‌به‌قدم اینجا می‌گذاریم.</p>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
